name: pack

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Pack
        run: bash packaging/pack.sh
      - uses: actions/upload-artifact@v4
        with:
          name: kidtimer-linux
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
      - name: Publish latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets=(dist/kidtimer-linux-amd64.tar.gz dist/kidtimer-linux-arm64.tar.gz dist/SHA256SUMS)
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest "${assets[@]}" --clobber
          else
            gh release create latest "${assets[@]}" --title latest --notes "Rolling pack for the install one-liner." --target "$GITHUB_SHA"
          fi
      - name: Publish tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/kidtimer-linux-amd64.tar.gz dist/kidtimer-linux-arm64.tar.gz dist/SHA256SUMS --title "$GITHUB_REF_NAME" --generate-notes
